name: Whisper
options:
  bundleIdPrefix: com.quincy
  deploymentTarget:
    macOS: 14.0
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Whisper:
    path: .
  HotKey:
    url: https://github.com/soffes/HotKey.git
    from: 0.2.0
targets:
  WhisperMac:
    type: application
    platform: macOS
    sources:
      - Sources/MacApp
    resources:
      - Design/Generated/WhisperV2.icns
    info:
      path: macOS/App/Info.plist
      properties:
        CFBundleIconFile: WhisperV2
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Whisper needs microphone access to capture dictation.
    dependencies:
      - package: Whisper
        product: WhisperShared
      - package: HotKey
        product: HotKey
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: macOS/App/WhisperMac.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.quincy.whisper
        PRODUCT_NAME: Whisper
        SWIFT_VERSION: 6.0
